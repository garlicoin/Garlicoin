name: Tagged Release Publisher

on:
  create:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-and-publish:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event_name == 'create' && github.event.ref || github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${RELEASE_TAG#release/}"

          if [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-rc([1-9][0-9]*))?$ ]]; then
            TAG_MAJOR="${BASH_REMATCH[1]}"
            TAG_MINOR="${BASH_REMATCH[2]}"
            TAG_REVISION="${BASH_REMATCH[3]}"
            RC_SUFFIX="${BASH_REMATCH[4]}"
          else
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          VERSION="${TAG_MAJOR}.${TAG_MINOR}.${TAG_REVISION}"
          RELEASE_LABEL="${RELEASE_TAG#v}"
          if [ -n "$RC_SUFFIX" ]; then
            PRERELEASE=true
            ASSET_VERSION="$RELEASE_LABEL"
          else
            PRERELEASE=false
            ASSET_VERSION="$VERSION"
          fi
          test -f "doc/release-notes-${VERSION}.md"

          MAJOR="$(sed -n 's/^define(_CLIENT_VERSION_MAJOR, \([0-9][0-9]*\))$/\1/p' configure.ac)"
          MINOR="$(sed -n 's/^define(_CLIENT_VERSION_MINOR, \([0-9][0-9]*\))$/\1/p' configure.ac)"
          REVISION="$(sed -n 's/^define(_CLIENT_VERSION_REVISION, \([0-9][0-9]*\))$/\1/p' configure.ac)"
          BUILD="$(sed -n 's/^define(_CLIENT_VERSION_BUILD, \([0-9][0-9]*\))$/\1/p' configure.ac)"
          test "${MAJOR}.${MINOR}.${REVISION}" = "$VERSION"
          test "$BUILD" = "0"

          TARGET_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = create ]; then
            # A release/vX.Y.Z or release/vX.Y.Z-rcN branch requests publication
            # through the same exact-tag validation gate.
            if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
              test "$tag_sha" = "$TARGET_SHA"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$TARGET_SHA"
            fi
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_LABEL=$RELEASE_LABEL" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=$ASSET_VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Dispatch exact-tag release validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-validation-ci.yml --ref "$RELEASE_TAG"

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list \
              --workflow release-validation-ci.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headBranch,headSha \
              --jq ".[] | select(.headBranch == \"$RELEASE_TAG\" and .headSha == \"$TARGET_SHA\") | .databaseId" \
              | head -n1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done

          test -n "$RUN_ID"
          echo "RELEASE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Release validation run: $RUN_ID"

      - name: Wait for release validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run watch "$RELEASE_RUN_ID" --exit-status

      - name: Download Linux release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$RELEASE_RUN_ID" -n release-linux-x86_64 -D release-input/linux

      - name: Download Linux ARM64 release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RELEASE_RUN_ID" -n release-linux-arm64 -D release-input/linux-arm64
          (cd release-input/linux-arm64 && sha256sum -c SHA256SUMS)

      - name: Download Windows release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$RELEASE_RUN_ID" -n release-windows-x86_64 -D release-input/windows

      - name: Download macOS release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$RELEASE_RUN_ID" -n release-macos-x86_64 -D release-input/macos

      - name: Download macOS ARM64 release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RELEASE_RUN_ID" -n release-macos-arm64 -D release-input/macos-arm64
          (cd release-input/macos-arm64 && sha256sum -c SHA256SUMS)

      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          cp "release-input/linux/garlicoin-${VERSION}-linux-x86_64.tar.gz" \
            "release-assets/garlicoin-${ASSET_VERSION}-linux-x86_64.tar.gz"
          cp "release-input/linux/garlicoin-${VERSION}.tar.gz" \
            "release-assets/garlicoin-${ASSET_VERSION}.tar.gz"
          cp "release-input/linux-arm64/garlicoin-${VERSION}-linux-arm64.tar.gz" \
            "release-assets/garlicoin-${ASSET_VERSION}-linux-arm64.tar.gz"
          cp "release-input/windows/garlicoin-${VERSION}-win64.zip" \
            "release-assets/garlicoin-${ASSET_VERSION}-win64.zip"
          cp "release-input/windows/garlicoin-${VERSION}-win64-setup.exe" \
            "release-assets/garlicoin-${ASSET_VERSION}-win64-setup.exe"
          cp "release-input/macos/garlicoin-${VERSION}-osx64.tar.gz" \
            "release-assets/garlicoin-${ASSET_VERSION}-osx64.tar.gz"
          cp "release-input/macos/garlicoin-${VERSION}-osx64.dmg" \
            "release-assets/garlicoin-${ASSET_VERSION}-osx64.dmg"
          cp "release-input/macos-arm64/garlicoin-${VERSION}-osx-arm64.tar.gz" \
            "release-assets/garlicoin-${ASSET_VERSION}-osx-arm64.tar.gz"
          cp "release-input/macos-arm64/garlicoin-${VERSION}-osx-arm64.dmg" \
            "release-assets/garlicoin-${ASSET_VERSION}-osx-arm64.dmg"

          (
            cd release-assets
            sha256sum garlicoin-* | sort -k2 > SHA256SUMS
          )

          rm -rf /tmp/grlc-release-check
          mkdir -p /tmp/grlc-release-check
          tar -xzf "release-assets/garlicoin-${ASSET_VERSION}-linux-x86_64.tar.gz" -C /tmp/grlc-release-check
          FIRST_LINE="$(/tmp/grlc-release-check/garlicoin-${VERSION}/bin/garlicoind --version | head -n1)"
          echo "$FIRST_LINE"
          SOURCE_SHA="$(git rev-parse HEAD)"
          VERSION_PREFIX="Garlicoin Core Daemon version v${RELEASE_LABEL}"

          if [ "$PRERELEASE" = true ]; then
            # An RC must identify itself with the exact rc tag, not merely the base version.
            test "$FIRST_LINE" = "$VERSION_PREFIX"
          elif [ "$FIRST_LINE" != "$VERSION_PREFIX" ]; then
            # Git's default abbreviation length can differ between build and publisher clones.
            SOURCE_SUFFIX="${FIRST_LINE#"$VERSION_PREFIX.0-"}"
            [[ "$SOURCE_SUFFIX" =~ ^[0-9a-f]{7,40}$ ]]
            [[ "$SOURCE_SHA" == "$SOURCE_SUFFIX"* ]]
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="doc/release-notes-${VERSION}.md"

          if [ "$PRERELEASE" = true ]; then
            TITLE="Garlicoin Core ${RELEASE_LABEL} - Release Candidate"
          else
            TITLE="Garlicoin Core ${VERSION} - GRLC.eu Maintenance Release"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            if [ "$PRERELEASE" = true ]; then
              gh release edit "$RELEASE_TAG" \
                --prerelease \
                --title "$TITLE" \
                --notes-file "$NOTES"
            else
              gh release edit "$RELEASE_TAG" \
                --title "$TITLE" \
                --notes-file "$NOTES"
            fi
          else
            if [ "$PRERELEASE" = true ]; then
              gh release create "$RELEASE_TAG" release-assets/* \
                --verify-tag \
                --prerelease \
                --title "$TITLE" \
                --notes-file "$NOTES"
            else
              gh release create "$RELEASE_TAG" release-assets/* \
                --verify-tag \
                --title "$TITLE" \
                --notes-file "$NOTES"
            fi
          fi
